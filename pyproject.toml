[project]
name = "antiphisher"
version = "0.1.0"
description = "Real-time phishing URL detector: LightGBM + character-level CNN ensemble"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data
    "numpy",
    "pandas",
    "tldextract",
    # ML
    "scikit-learn",
    "lightgbm",
    "onnxruntime",
    # API
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
# Only needed on your laptop (training, data collection, analysis, tests).
# Not installed in the production Docker image.
dev = [
    "torch",
    "onnx",
    "requests",
    "beautifulsoup4",
    "matplotlib",
    "jupyter",
    "pytest",
    "ruff",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antiphisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
